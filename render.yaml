services:
  - type: web
    name: plandem-portal-eventos
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SUPERADMIN_EMAIL
        value: jmv1985jmv@gmail.com
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OTP_EMAIL_ENABLED
        value: true
      - key: OTP_EXP_MINUTES
        value: 10
      - key: OTP_MAX_ATTEMPTS
        value: 5
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ALLOW_CONSOLE_OTP
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: plandem/perfiles
      - key: CLOUDINARY_PROFILE_STORAGE_REQUIRED
        value: "false"
      - key: NODE_ENV
        value: production
